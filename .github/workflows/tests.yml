name: Tests

on:
  push:
  pull_request:

# Un nouveau push annule les tests encore en cours sur la même branche
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Même version de Python que sur Streamlit Community Cloud
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Vérifier l'absence de conflit entre dépendances
        run: pip check

      - name: Lancer les tests
        run: python -m pytest
